name: datatype
annotations:
  upstream_repository:
    tag: upstream_repository
    value: https://github.com/AGLDWG/datatype-ont
  upstream_branch:
    tag: upstream_branch
    value: master
  upstream_commit:
    tag: upstream_commit
    value: dd8f24120cd59f686086f58175de37807c569e18
  upstream_created:
    tag: upstream_created
    value: '2019-03-25'
  upstream_creator:
    tag: upstream_creator
    value: Simon J.D. Cox, CSIRO, https://orcid.org/0000-0002-3884-3420
  upstream_licence:
    tag: upstream_licence
    value: CC0-1.0 in the ontology's dcterms:license; CC-BY-4.0 in the repository's
      LICENSE
description: 'A LinkML rendering of the Datatype Ontology ("Datatypes") of the Australian
  Government Linked Data Working Group (AGLDWG), by Simon Cox of CSIRO. In its own
  words: a set of classes representing data-types. These may be used for observation
  results, or for the range of specific properties in other applications where scaled
  numbers, ranges, percents etc are required. Each class and property keeps the ontology''s
  local name and IRI.'
title: Datatype Ontology
comments:
- The ontology states no owl:versionInfo or owl:versionIRI, and its repository has
  no tag or release, so the version is the ontology's dcterms:modified date. upstream/
  copies its Turtle file and licence at the commit in the annotations, and scripts/check_upstream_release.py
  reports when the master branch moves.
- The ontology's own dcterms:license is CC0 1.0, and the repository's LICENSE, added
  later, is CC BY 4.0. Each description is the ontology's skos:definition of the term,
  used with the attribution NOTICE gives.
- 'The classes are closed: a value carries only the properties the ontology''s restrictions
  on its class name. OWL leaves a class open to other properties, so data that adds,
  say, a standard to a QuantitativeMeasure is valid OWL but not valid here.'
- 'Three rules are this project''s, not the ontology''s, each marked where it is stated:
  a percent lies between 0 and 100, an uncertainty is not negative, and a range''s
  min is not above its max. The validator checks the first two; no validator can compare
  two slots, so tests/test_data.py checks the third over the examples.'
source: http://linked.data.gov.au/def/datatype
see_also:
- https://lmodel.github.io/datatype
- https://github.com/AGLDWG/datatype-ont/tree/dd8f24120cd59f686086f58175de37807c569e18
id: https://w3id.org/lmodel/datatype
version: '2019-10-03'
imports:
- linkml:types
license: Apache-2.0
prefixes:
  datatype_linkml:
    prefix_prefix: datatype_linkml
    prefix_reference: https://w3id.org/lmodel/datatype/
  data:
    prefix_prefix: data
    prefix_reference: http://linked.data.gov.au/def/datatype/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  rdf:
    prefix_prefix: rdf
    prefix_reference: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
default_prefix: datatype_linkml
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
slots:
  rdf_value:
    name: rdf_value
    definition_uri: https://w3id.org/lmodel/datatype/rdf_value
    description: The main value of a structured value, as RDF's own rdf:value property
      names it. The ontology restricts it on Concept and makes value, min, max and
      uncertainty its sub-properties.
    title: value
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - rdf:value
    slot_uri: rdf:value
    owner: Concept
    domain_of:
    - Concept
    range: string
  value:
    name: value
    definition_uri: https://w3id.org/lmodel/datatype/value
    description: simple value (a literal)
    title: data value
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:value
    is_a: rdf_value
    slot_uri: data:value
    owner: Text
    domain_of:
    - Boolean
    - Count
    - QuantitativeMeasure
    - Text
    range: string
  min:
    name: min
    definition_uri: https://w3id.org/lmodel/datatype/min
    description: Minimum value of range
    title: data minimum
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:min
    is_a: rdf_value
    slot_uri: data:min
    owner: QuantitativeRange
    domain_of:
    - QuantitativeRange
    range: decimal
  max:
    name: max
    definition_uri: https://w3id.org/lmodel/datatype/max
    description: Maximum value of a range
    title: data maximum
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:max
    is_a: rdf_value
    slot_uri: data:max
    owner: QuantitativeRange
    domain_of:
    - QuantitativeRange
    range: decimal
  uncertainty:
    name: uncertainty
    definition_uri: https://w3id.org/lmodel/datatype/uncertainty
    description: Uncertainty for a quantitative value
    title: data uncertainty
    comments:
    - 'This project''s rule: an uncertainty is not negative. The ontology states no
      bound.'
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:uncertainty
    is_a: rdf_value
    slot_uri: data:uncertainty
    owner: QuantitativeRange
    domain_of:
    - Count
    - QuantitativeMeasure
    - QuantitativeRange
    range: decimal
    minimum_value: 0
  standard:
    name: standard
    definition_uri: https://w3id.org/lmodel/datatype/standard
    description: Measurement standard, scale, uom, reference system, controlled vocabulary,
      taxonomy etc
    title: data standard
    comments:
    - No class of the ontology restricts this property; it is the parent of unit and
      vocabulary.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:standard
    slot_uri: data:standard
    range: uriorcurie
  unit:
    name: unit
    definition_uri: https://w3id.org/lmodel/datatype/unit
    description: Measurement scale
    title: unit of measure
    comments:
    - The unit by its IRI, such as http://qudt.org/vocab/unit/M from the QUDT units
      vocabulary. The ontology states no range.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:unit
    is_a: standard
    slot_uri: data:unit
    owner: QuantitativeRange
    domain_of:
    - QuantitativeMeasure
    - QuantitativeRange
    range: uriorcurie
  vocabulary:
    name: vocabulary
    definition_uri: https://w3id.org/lmodel/datatype/vocabulary
    description: controlled vocabulary, taxonomy etc
    title: vocabulary
    comments:
    - The vocabulary by its IRI. The ontology's range is a skos:ConceptScheme, a skos:Collection
      or an owl:Ontology, which the validator cannot check of an IRI.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:vocabulary
    is_a: standard
    slot_uri: data:vocabulary
    owner: Concept
    domain_of:
    - Concept
    range: uriorcurie
  Boolean_value:
    name: Boolean_value
    definition_uri: https://w3id.org/lmodel/datatype/value
    description: simple value (a literal)
    title: data value
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:value
    is_a: value
    domain: Boolean
    slot_uri: data:value
    alias: value
    owner: Boolean
    domain_of:
    - Boolean
    is_usage_slot: true
    usage_slot_name: value
    range: boolean
    required: true
  Concept_rdf_value:
    name: Concept_rdf_value
    definition_uri: https://w3id.org/lmodel/datatype/rdf_value
    description: The main value of a structured value, as RDF's own rdf:value property
      names it. The ontology restricts it on Concept and makes value, min, max and
      uncertainty its sub-properties.
    title: value
    comments:
    - The concept by its IRI. The ontology's range is a skos:Concept, which the validator
      cannot check of an IRI.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - rdf:value
    is_a: rdf_value
    domain: Concept
    slot_uri: rdf:value
    alias: rdf_value
    owner: Concept
    domain_of:
    - Concept
    is_usage_slot: true
    usage_slot_name: rdf_value
    range: uriorcurie
    required: true
  Concept_vocabulary:
    name: Concept_vocabulary
    definition_uri: https://w3id.org/lmodel/datatype/vocabulary
    description: controlled vocabulary, taxonomy etc
    title: vocabulary
    comments:
    - The vocabulary by its IRI. The ontology's range is a skos:ConceptScheme, a skos:Collection
      or an owl:Ontology, which the validator cannot check of an IRI.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:vocabulary
    is_a: vocabulary
    domain: Concept
    slot_uri: data:vocabulary
    alias: vocabulary
    owner: Concept
    domain_of:
    - Concept
    is_usage_slot: true
    usage_slot_name: vocabulary
    range: uriorcurie
    required: true
  Count_value:
    name: Count_value
    definition_uri: https://w3id.org/lmodel/datatype/value
    description: simple value (a literal)
    title: data value
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:value
    is_a: value
    domain: Count
    slot_uri: data:value
    alias: value
    owner: Count
    domain_of:
    - Count
    is_usage_slot: true
    usage_slot_name: value
    range: integer
    required: true
  QuantitativeMeasure_value:
    name: QuantitativeMeasure_value
    definition_uri: https://w3id.org/lmodel/datatype/value
    description: simple value (a literal)
    title: data value
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:value
    is_a: value
    domain: QuantitativeMeasure
    slot_uri: data:value
    alias: value
    owner: QuantitativeMeasure
    domain_of:
    - QuantitativeMeasure
    is_usage_slot: true
    usage_slot_name: value
    range: decimal
    required: true
  QuantitativeMeasure_unit:
    name: QuantitativeMeasure_unit
    definition_uri: https://w3id.org/lmodel/datatype/unit
    description: Measurement scale
    title: unit of measure
    comments:
    - The unit by its IRI, such as http://qudt.org/vocab/unit/M from the QUDT units
      vocabulary. The ontology states no range.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:unit
    is_a: unit
    domain: QuantitativeMeasure
    slot_uri: data:unit
    alias: unit
    owner: QuantitativeMeasure
    domain_of:
    - QuantitativeMeasure
    is_usage_slot: true
    usage_slot_name: unit
    range: uriorcurie
    required: true
  QuantitativeRange_min:
    name: QuantitativeRange_min
    definition_uri: https://w3id.org/lmodel/datatype/min
    description: Minimum value of range
    title: data minimum
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:min
    is_a: min
    domain: QuantitativeRange
    slot_uri: data:min
    alias: min
    owner: QuantitativeRange
    domain_of:
    - QuantitativeRange
    is_usage_slot: true
    usage_slot_name: min
    range: decimal
    required: true
  QuantitativeRange_max:
    name: QuantitativeRange_max
    definition_uri: https://w3id.org/lmodel/datatype/max
    description: Maximum value of a range
    title: data maximum
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:max
    is_a: max
    domain: QuantitativeRange
    slot_uri: data:max
    alias: max
    owner: QuantitativeRange
    domain_of:
    - QuantitativeRange
    is_usage_slot: true
    usage_slot_name: max
    range: decimal
    required: true
  QuantitativeRange_unit:
    name: QuantitativeRange_unit
    definition_uri: https://w3id.org/lmodel/datatype/unit
    description: Measurement scale
    title: unit of measure
    comments:
    - The unit by its IRI, such as http://qudt.org/vocab/unit/M from the QUDT units
      vocabulary. The ontology states no range.
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:unit
    is_a: unit
    domain: QuantitativeRange
    slot_uri: data:unit
    alias: unit
    owner: QuantitativeRange
    domain_of:
    - QuantitativeRange
    is_usage_slot: true
    usage_slot_name: unit
    range: uriorcurie
    required: true
  Percent_unit:
    name: Percent_unit
    definition_uri: https://w3id.org/lmodel/datatype/unit
    description: Measurement scale
    title: unit of measure
    comments:
    - 'The ontology''s owl:hasValue: the unit is QUDT''s PERCENT and no other. A pattern
      states it, since equals_string needs a string range.'
    from_schema: https://w3id.org/lmodel/datatype
    mappings:
    - data:unit
    is_a: QuantitativeMeasure_unit
    domain: Percent
    slot_uri: data:unit
    alias: unit
    owner: Percent
    domain_of:
    - Percent
    is_usage_slot: true
    usage_slot_name: unit
    range: uriorcurie
    required: true
