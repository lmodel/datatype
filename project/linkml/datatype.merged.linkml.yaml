  "description": "A LinkML rendering of the Datatype Ontology (\"Datatypes\") of the Australian Government Linked Data Working Group (AGLDWG), by Simon Cox of CSIRO. In its own words: a set of classes representing data-types. These may be used for observation results, or for the range of specific properties in other applications where scaled numbers, ranges, percents etc are required. Each class and property keeps the ontology's local name and IRI.",
  "title": "Datatype Ontology",
  "comments": [
    "The ontology states no owl:versionInfo or owl:versionIRI, and its repository has no tag or release, so the version is the ontology's dcterms:modified date. upstream/ copies its Turtle file and licence at the commit in the annotations, and scripts/check_upstream_release.py reports when the master branch moves.",
    "The title and description of each of the ontology's terms are its rdfs:label and skos:definition. The ontology states CC0 1.0 as its dcterms:license, and the repository's LICENSE, added later, is CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). This rendering follows CC BY 4.0, is provided as is, and carries the attribution that https://github.com/lmodel/datatype/blob/main/NOTICE gives.",
    "The classes are closed: a value carries only the properties the ontology's restrictions on its class name. OWL leaves a class open to other properties, so data that adds, say, a standard to a QuantitativeMeasure is valid OWL but not valid here."
  ],
  "source": "http://linked.data.gov.au/def/datatype",
  "see_also": [
    "https://lmodel.github.io/datatype",
    "https://github.com/AGLDWG/datatype-ont/tree/dd8f24120cd59f686086f58175de37807c569e18"
  ],
